<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級午餐訂餐系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 頁首標題 -->
    <header class="bg-indigo-600 text-white rounded-2xl p-6 shadow-lg text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold flex items-center justify-center md:justify-start gap-3">
          <i class="fa-solid font-utensils"></i> 班級午餐訂餐系統
        </h1>
        <p class="text-indigo-200 mt-1 text-sm">每日早上統一登記全班訂餐資料與金額自動結算</p>
      </div>
      <button onclick="window.print()" class="bg-indigo-500 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow flex items-center gap-2">
        <i class="fa-solid fa-print"></i> 列印 / 匯出報表
      </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 1. 菜單管理 display -->
      <section class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 border-b pb-3 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-book-open text-indigo-500"></i> 今日菜單
        </h2>
        <div id="menu-list" class="space-y-3">
          <!-- 由 JavaScript 動態繪製 -->
        </div>
      </section>

      <!-- 2. 訂餐登記輸入區 -->
      <section class="md:col-span-2 bg-white p-6 rounded-2xl shadow-md border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 border-b pb-3 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-indigo-500"></i> 訂餐登記 (座號 0 結束)
        </h2>

        <!-- 訊息提示框 -->
        <div id="message-box" class="hidden mb-4 p-3 rounded-xl text-sm font-medium transition-all"></div>

        <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-1">座號 (1 ~ 50，輸入 0 結算)</label>
              <input type="number" id="seat-number" min="0" max="50" placeholder="例如: 15" required
                     class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-1">餐點編號 (1 ~ 5)</label>
              <input type="number" id="item-code" min="1" max="5" placeholder="例如: 2"
                     class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>
          </div>

          <div class="flex gap-3 pt-2">
            <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl shadow transition">
              <i class="fa-solid fa-plus mr-1"></i> 加入/更新訂單
            </button>
            <button type="button" onclick="finishOrdering()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow transition">
              <i class="fa-solid fa-check mr-1"></i> 登記完成 (座號 0)
            </button>
          </div>
        </form>
      </section>
    </div>

    <!-- 4. 結算報表與訂單詳細記錄 -->
    <section class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 border-b pb-3 mb-4 flex items-center justify-between">
        <span class="flex items-center gap-2"><i class="fa-solid fa-chart-pie text-indigo-500"></i> 訂餐統計與結算報表</span>
        <span id="total-count-badge" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold">總筆數：0 筆</span>
      </h2>

      <!-- 品項統計表格 -->
      <div class="overflow-x-auto mb-6">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-600 text-sm font-semibold border-b">
              <th class="py-3 px-4">編號</th>
              <th class="py-3 px-4">餐點名稱</th>
              <th class="py-3 px-4">單價</th>
              <th class="py-3 px-4 text-center">訂購數量</th>
              <th class="py-3 px-4 text-right">小計金額</th>
            </tr>
          </thead>
          <tbody id="summary-tbody" class="divide-y divide-slate-100 text-sm">
            <!-- JavaScript 動態產生 -->
          </tbody>
          <tfoot>
            <tr class="bg-slate-50 font-bold text-slate-800 text-base border-t-2">
              <td colspan="4" class="py-3.5 px-4 text-right">全班總金額：</td>
              <td id="grand-total" class="py-3.5 px-4 text-right text-indigo-600 text-lg">NT$ 0</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- 明細列表 -->
      <details class="group border rounded-xl p-4 bg-slate-50">
        <summary class="font-semibold text-slate-700 cursor-pointer flex justify-between items-center select-none">
          <span><i class="fa-solid fa-list-check mr-2 text-indigo-500"></i> 已登記座號明細清單</span>
          <span class="text-xs text-slate-400 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div id="order-details-list" class="mt-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 text-xs">
          <!-- JavaScript 動態產生 -->
        </div>
      </details>
    </section>

  </div>

  <!-- 邏輯程式 -->
  <script>
    // 1. 內建 5 項菜單資料
    const MENU = [
      { id: 1, name: '排骨便當', price: 80 },
      { id: 2, name: '雞腿便當', price: 85 },
      { id: 3, name: '素食便當', price: 70 },
      { id: 4, name: '滷肉飯',   price: 55 },
      { id: 5, name: '貢丸湯',   price: 20 }
    ];

    // 儲存全班訂單資料: key 為座號 (seatNum), value 為餐點 ID (itemId)
    let orders = {};

    // 頁面初始化
    document.addEventListener('DOMContentLoaded', () => {
      renderMenu();
      updateReport();
    });

    // 渲染菜單列表
    function renderMenu() {
      const menuContainer = document.getElementById('menu-list');
      menuContainer.innerHTML = MENU.map(item => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-100 transition cursor-pointer"
             onclick="quickSelectMenu(${item.id})">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 flex items-center justify-center bg-indigo-600 text-white rounded-lg text-sm font-bold">${item.id}</span>
            <span class="font-medium text-slate-700">${item.name}</span>
          </div>
          <span class="font-bold text-slate-600">NT$ ${item.price}</span>
        </div>
      `).join('');
    }

    // 點擊菜單快速填入餐點編號
    function quickSelectMenu(itemId) {
      document.getElementById('item-code').value = itemId;
      document.getElementById('seat-number').focus();
    }

    // 顯示訊息通知
    function showMessage(msg, isError = false) {
      const box = document.getElementById('message-box');
      box.className = `mb-4 p-3 rounded-xl text-sm font-medium transition-all ${
        isError ? 'bg-rose-100 text-rose-700 border border-rose-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'
      }`;
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    // 隱藏訊息通知
    function hideMessage() {
      document.getElementById('message-box').classList.add('hidden');
    }

    // 處理表單提交（新增/更新訂單）
    function handleOrderSubmit(e) {
      e.preventDefault();
      hideMessage();

      const seatInput = document.getElementById('seat-number').value.trim();
      const itemInput = document.getElementById('item-code').value.trim();

      const seatNum = parseInt(seatInput, 10);

      // 檢查座號 0：代表結束登記
      if (seatNum === 0) {
        finishOrdering();
        return;
      }

      // 3. 輸入驗證：座號 1~50
      if (isNaN(seatNum) || seatNum < 1 || seatNum > 50) {
        showMessage('【輸入錯誤】座號必須介於 1 到 50 之間！(或輸入 0 結束)', true);
        document.getElementById('seat-number').focus();
        return;
      }

      const itemId = parseInt(itemInput, 10);
      const menuItem = MENU.find(m => m.id === itemId);

      // 3. 輸入驗證：餐點編號須在菜單範圍內 (1~5)
      if (isNaN(itemId) || !menuItem) {
        showMessage('【輸入錯誤】餐點編號無效，請輸入 1 ~ 5 之間的餐點編號！', true);
        document.getElementById('item-code').focus();
        return;
      }

      // 成功登記訂單
      orders[seatNum] = itemId;
      showMessage(`✅ 已成功為 [ ${seatNum} 號 ] 登記餐點：${menuItem.name} ($${menuItem.price})`);

      // 清空輸入並重置對焦
      document.getElementById('seat-number').value = '';
      document.getElementById('item-code').value = '';
      document.getElementById('seat-number').focus();

      // 更新報表
      updateReport();
    }

    // 完成登記（座號 0）
    function finishOrdering() {
      document.getElementById('seat-number').value = '';
      document.getElementById('item-code').value = '';
      showMessage('🎉 已完成訂餐登記！結算報表已更新於上方。', false);
      updateReport();
    }

    // 刪除單筆訂單
    function deleteOrder(seat) {
      delete orders[seat];
      showMessage(`已移除 ${seat} 號的訂單。`);
      updateReport();
    }

    // 4. 計算並更新結算報表
    function updateReport() {
      const summaryTbody = document.getElementById('summary-tbody');
      const detailsList = document.getElementById('order-details-list');
      const totalCountBadge = document.getElementById('total-count-badge');
      const grandTotalEl = document.getElementById('grand-total');

      let grandTotal = 0;
      let totalCount = Object.keys(orders).length;

      // 統計各品項數量
      const counts = {};
      MENU.forEach(m => counts[m.id] = 0);

      Object.values(orders).forEach(itemId => {
        if (counts[itemId] !== undefined) {
          counts[itemId]++;
        }
      });

      // 渲染各品項小計表格
      summaryTbody.innerHTML = MENU.map(item => {
        const qty = counts[item.id];
        const subtotal = qty * item.price;
        grandTotal += subtotal;

        return `
          <tr class="${qty > 0 ? 'bg-indigo-50/40 font-medium' : 'text-slate-400'} hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-bold text-slate-500">${item.id}</td>
            <td class="py-3 px-4">${item.name}</td>
            <td class="py-3 px-4">NT$ ${item.price}</td>
            <td class="py-3 px-4 text-center">
              <span class="${qty > 0 ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-500'} px-2.5 py-1 rounded-full text-xs font-bold">
                ${qty}
              </span>
            </td>
            <td class="py-3 px-4 text-right font-semibold text-slate-700">NT$ ${subtotal}</td>
          </tr>
        `;
      }).join('');

      // 更新全班總金額與總筆數
      grandTotalEl.textContent = `NT$ ${grandTotal}`;
      totalCountBadge.textContent = `總訂餐筆數：${totalCount} 筆`;

      // 渲染所有已訂餐座號明細清單
      const seats = Object.keys(orders).map(Number).sort((a, b) => a - b);
      if (seats.length === 0) {
        detailsList.innerHTML = `<div class="col-span-full text-center text-slate-400 py-2">目前尚無任何訂餐資料</div>`;
      } else {
        detailsList.innerHTML = seats.map(seat => {
          const itemId = orders[seat];
          const item = MENU.find(m => m.id === itemId);
          return `
            <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200 shadow-sm">
              <div>
                <span class="font-bold text-slate-700">${seat}號</span>
                <span class="text-slate-500 ml-1">${item ? item.name : ''}</span>
              </div>
              <button onclick="deleteOrder(${seat})" class="text-rose-400 hover:text-rose-600 p-1" title="刪除">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          `;
        }).join('');
      }
    }
  </script>
</body>
</html>
